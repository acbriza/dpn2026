<text x="34" y="240" font-family="Arial" font-size="11.5" fill="#898781">Stratified K-Fold: 3-fold, outer-training set only</text>

<rect x="34" y="250" width="332" height="15" rx="3" fill="#2a78d6"/>
<text x="200" y="261" font-family="Arial" font-size="10.5" fill="#ffffff" text-anchor="middle">outer-training set</text>
