experiment:
  summary: binary classification - exploratory data analysis for the BMC MIDM submission
  classification_type: binary
  stage: eda
  tag: final_202608
  verbosity: 1
  random_seed: 42

data:
  dataset_path: ../dataset/EAMC_DPN_Dataset.xlsx
  features_path: ../dataset/DPN Features.xlsx

# Participant flow (STROBE). Counts come from the Data Collection protocol; the
# enrolled -> analysed step is derived at runtime from the loader's dropped rows.
cohort:
  screened: 201
  enrolled: 190
  screening_exclusion_reason: >-
    limb amputation, gangrenous or necrotic foot, implanted cardiac pacemaker or
    defibrillator, or another known cause of polyneuropathy

# Reference performance quoted on the univariable-discrimination figure, read
# from the hyperparameter optimization stage so the figure can never quote a
# stale number. Path is resolved against the experiments/ directory.
model_reference:
  name: CatBoost
  metrics_path: binary/hyperparameter_optimization/catboost/final_202608/optimization_metrics_ci.csv

analysis:
  # Feature groups withheld from modelling. NCS enters the 2009 Toronto
  # consensus definition of Confirmed DPN, so using it as a predictor would be
  # circular; edareport.py audits this rather than assuming it.
  excluded_groups:
    - Nerve conduction study
  exclusion_reason: >-
    Component of the 2009 Toronto consensus definition of confirmed diabetic
    peripheral neuropathy; retaining these variables as predictors would be
    circular
  bootstrap_n: 2000
  fisher_expected_min: 5
  vif_threshold: 5

# Features the DiCE counterfactual engine is permitted to vary; must match
# dice.cf_features.actionable in the counterfactual config.
cf_features:
  actionable: INSULIN,HBA1C,HPN,PAOD,DSLPDMIA,CKD

reporting:
  # Output lands in experiments/<classification_type>/<output_subdir>.
  output_subdir: eda
  figure_width_mm: 170
  formats:
    - pdf
    - png
