<line x1="40" y1="624" x2="40" y2="632" stroke="#898781" stroke-width="1.5"/>
<polygon points="36,632 44,632 40,640" fill="#898781"/>

<!-- ===================== PANEL 4 : EXPLAINING THE MODEL (WRAPPER) ===================== -->
<rect x="20" y="640" width="610" height="250" rx="6" fill="#eeede8" stroke="#cfcec6" stroke-width="1"/>
<text x="34" y="660" font-family="Arial" font-size="14.5" font-weight="bold" fill="#0b0b0b">Explaining the model</text>
<text x="196" y="660" font-family="Arial" font-size="11.5" fill="#898781">&#183; repeat 1 only: its 4 fold models and thresholds, saved and reused</text>

<!-- --- sub-panel A : feature importance &amp; SHAP --- -->
<rect x="32" y="668" width="586" height="103" rx="5" fill="#f9f9f7" stroke="#dedcd4" stroke-width="1"/>
<text x="44" y="686" font-family="Arial" font-size="13" font-weight="bold" fill="#0b0b0b">Feature importance &amp; SHAP</text>
<text x="232" y="686" font-family="Arial" font-size="11.5" fill="#898781">&#183; the 4 fold models, refit</text>
<text x="44" y="701" font-family="Arial" font-size="12.3" fill="#52514e">Refit with identical params, data and seed &#8212; reproduces the stored models</text>

<rect x="44" y="709" width="280" height="54" rx="5" fill="#ffffff" stroke="#a3197a" stroke-width="1.5"/>
<text x="56" y="726" font-family="Arial" font-size="12.9" font-weight="bold" fill="#a3197a">Feature Importance</text>
<text x="56" y="740" font-family="Arial" font-size="12.3" fill="#52514e">get feature importance per</text>
<text x="56" y="754" font-family="Arial" font-size="12.3" fill="#52514e">fold model &#8594; 4-model heatmap</text>

<rect x="338" y="709" width="268" height="54" rx="5" fill="#ffffff" stroke="#a3197a" stroke-width="1.5"/>
<text x="350" y="726" font-family="Arial" font-size="12.9" font-weight="bold" fill="#a3197a">SHAP</text>
<text x="350" y="740" font-family="Arial" font-size="12.3" fill="#52514e">Explainer over each fold&#8217;s own</text>
<text x="350" y="754" font-family="Arial" font-size="12.3" fill="#52514e">test fold &#8594; mean |SHAP| heatmap</text>

<!-- --- sub-panel B : counterfactuals --- -->
<rect x="32" y="779" width="586" height="101" rx="5" fill="#f9f9f7" stroke="#dedcd4" stroke-width="1"/>
<text x="44" y="797" font-family="Arial" font-size="13" font-weight="bold" fill="#0b0b0b">Counterfactuals (DiCE)</text>
<text x="210" y="797" font-family="Arial" font-size="11.5" fill="#898781">&#183; the same 4 models, used as stored &#8212; no refit</text>
<text x="44" y="812" font-family="Arial" font-size="12.3" fill="#52514e">Each wrapped with its own tuned threshold, so DiCE decides at that cut-off, not 0.5</text>

<rect x="44" y="820" width="166" height="52" rx="5" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/>
<text x="56" y="836" font-family="Arial" font-size="12.9" font-weight="bold" fill="#0b7285">Instances of interest</text>
<text x="56" y="850" font-family="Arial" font-size="11.8" fill="#52514e">misclassified, or</text>
<text x="56" y="864" font-family="Arial" font-size="11.8" fill="#52514e">|p &#8722; threshold| &#8804; 0.08</text>

<line x1="210" y1="846" x2="218" y2="846" stroke="#898781" stroke-width="1.5"/>
<polygon points="218,842 218,850 226,846" fill="#898781"/>

<rect x="226" y="820" width="150" height="52" rx="5" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/>
<text x="238" y="836" font-family="Arial" font-size="12.9" font-weight="bold" fill="#0b7285">DiCE genetic search</text>
<text x="238" y="850" font-family="Arial" font-size="11.8" fill="#52514e">varies only the 6</text>
<text x="238" y="864" font-family="Arial" font-size="11.8" fill="#52514e">actionable features</text>

<line x1="376" y1="846" x2="384" y2="846" stroke="#898781" stroke-width="1.5"/>
<polygon points="384,842 384,850 392,846" fill="#898781"/>

<rect x="392" y="820" width="214" height="52" rx="5" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/>
<text x="404" y="836" font-family="Arial" font-size="12.9" font-weight="bold" fill="#0b7285">Outputs per fold</text>
<text x="404" y="857" font-family="Arial" font-size="11.8" fill="#52514e">local CFs + global CF importance</text>

