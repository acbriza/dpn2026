<text x="46" y="366" font-family="Arial" font-size="13" font-weight="bold" fill="#4a3aa7">Optuna TPE &#8212; 100 trials per outer iteration</text>
<text x="46" y="382" font-family="Arial" font-size="12.9" fill="#0b0b0b">Objective: mean AUPRC across the 3 validation folds</text>
<text x="46" y="397" font-family="Arial" font-size="12.9" fill="#52514e">Tunes: depth &#183; learning rate &#183; L2 leaf regularization &#183; positive-class weight</text>

<!-- ===== CONNECTOR: PANEL 2 -> PANEL 3 ===== -->
<line x1="40" y1="418" x2="40" y2="438" stroke="#898781" stroke-width="1.5"/>
<polygon points="36,438 44,438 40,446" fill="#898781"/>
<text x="54" y="434" font-family="Arial" font-size="11.5" fill="#52514e">carried forward: winning hyperparameters + the same 3 inner splits</text>

<!-- ===================== PANEL 3 : REFIT / THRESHOLD / EVAL ===================== -->
<rect x="20" y="446" width="610" height="178" rx="6" fill="#f7f7f5" stroke="#d8d7d0" stroke-width="1"/>
<text x="34" y="466" font-family="Arial" font-size="14.5" font-weight="bold" fill="#0b0b0b">Refit, threshold selection, and outer-test evaluation</text>
<text x="460" y="466" font-family="Arial" font-size="11.5" fill="#898781">&#183; per outer iteration</text>

<rect x="34" y="478" width="496" height="36" rx="5" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="46" y="494" font-family="Arial" font-size="13" font-weight="bold" fill="#2a78d6">1 &#183; Refit</text>
<text x="46" y="508" font-family="Arial" font-size="12.9" fill="#52514e">Winning params refit on the full outer-training set</text>

<rect x="34" y="526" width="262" height="36" rx="5" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5"/>
<text x="46" y="542" font-family="Arial" font-size="13" font-weight="bold" fill="#1baf7a">2 &#183; Out-of-fold scores</text>
<text x="46" y="556" font-family="Arial" font-size="12.9" fill="#52514e">One held-out score per patient</text>

<line x1="296" y1="544" x2="304" y2="544" stroke="#898781" stroke-width="1.5"/>
<polygon points="304,540 304,548 312,544" fill="#898781"/>

<rect x="312" y="526" width="218" height="36" rx="5" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
<text x="324" y="542" font-family="Arial" font-size="13" font-weight="bold" fill="#4a3aa7">3 &#183; Decision threshold</text>
<text x="324" y="556" font-family="Arial" font-size="12.9" fill="#52514e">Maximize F1 on the OOF curve</text>

<line x1="530" y1="496" x2="560" y2="496" stroke="#898781" stroke-width="1.5"/>
<line x1="530" y1="544" x2="560" y2="544" stroke="#898781" stroke-width="1.5"/>
<line x1="560" y1="496" x2="560" y2="592" stroke="#898781" stroke-width="1.5"/>
<line x1="560" y1="592" x2="538" y2="592" stroke="#898781" stroke-width="1.5"/>
<polygon points="538,588 538,596 530,592" fill="#898781"/>

<rect x="34" y="574" width="496" height="36" rx="5" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
